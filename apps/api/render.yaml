services:
  - type: web
    name: mezmarket-api
    runtime: node
    repo: https://github.com/SaleamlakH/mezmarket
    plan: free
    region: virginia
    buildCommand: pnpm install --frozen-lockfile && pnpm build --filter api...
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
