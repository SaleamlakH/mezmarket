name: Deployment

on:
  push:
    tags:
      - api@*
      - web@*

  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Select the target package to deploy'
        required: true
        type: choice
        options:
          - refs/tags/api@manual
          - refs/tags/web@manual

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.resolve.outputs.deploy_api }}
      deploy_web: ${{ steps.resolve.outputs.deploy_web }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor $GITHUB_SHA origin/main; then
            echo  "Tag is not on main. Aborting."
            exit 1
          fi
      - name: Resolve deploy target
        id: resolve
        run: node scripts/ci/resolve-deploy-target.mjs
        env:
          DEPLOY_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || github.event.inputs.target_tag }}

  deploy-api:
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.deploy_api == 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Trigger Render Deployment
        id: trigger
        run: node scripts/ci/trigger-render.mjs
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Poll Render until live
        run: node scripts/ci/poll-render.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.trigger.outputs.render_deploy_id }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: [prepare, deploy-api]
    if: |
      always() &&
      needs.prepare.outputs.deploy_web == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')

    steps:
      - name: Trigger Vercel Deployment
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
