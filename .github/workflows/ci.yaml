name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.changeset/**'
      - '.husky/**'
      - '.docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.changeset/**'
      - '.husky/**'
      - '.docs/**'
      - 'README.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # A fake connection string tricks Prisma's validation
      DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
